<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Hub — Prototype</title>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-serif:Georgia,"Songti SC","STSong","Times New Roman",serif;
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;padding-bottom:130px}
body.variant-A{--bg:#f4f6f8;--panel:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--accent-soft:#eff6ff;--radius:8px;--shadow:0 1px 2px rgba(0,0,0,.05)}
body.variant-B{--bg:#f6f1e8;--panel:#fffdf8;--ink:#1c1917;--muted:#78716c;--line:#e7dfd3;--accent:#0f766e;--accent-soft:#ecfdf5;--radius:18px;--shadow:0 12px 30px rgba(28,25,23,.08)}
body.variant-C{--bg:#fbf7ef;--panel:#fffdf7;--ink:#171412;--muted:#786f63;--line:#ded5c4;--accent:#c2410c;--accent-soft:#fff1e8;--radius:2px;--shadow:none}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.proto-banner{background:#111;color:#fff;font-size:11px;letter-spacing:.08em;padding:6px 18px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.proto-banner span{color:#a3a3a3;letter-spacing:0}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{font-size:19px;font-weight:800;letter-spacing:-.03em}
.brand span{color:var(--accent)}
.main-nav{display:flex;gap:4px}
.main-nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:650}
.main-nav button.active{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 18%,transparent)}
.topbar-meta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
.proto-pill{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.page-head{max-width:1440px;margin:0 auto;padding:30px 24px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.page-head h1{font-size:30px;letter-spacing:-.03em;line-height:1.12}
.page-head p{color:var(--muted);margin-top:7px;max-width:670px}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.head-stat{text-align:right;border-left:1px solid var(--line);padding-left:20px}
.head-stat strong{display:block;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.head-stat span{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.workbench{max-width:1440px;margin:0 auto;padding:0 24px 40px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px}
.filters{align-self:start;position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.mobile-filter-panel{display:none!important}
.filters-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.filter-group{margin-bottom:15px}
.filter-title{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.check{display:flex;align-items:center;gap:7px;font-size:12px;padding:3px 0;cursor:pointer}
.check input,.switch-row input,.mini-check input{accent-color:var(--accent)}
select,input[type=text],input[type=search],.search{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 9px;font:inherit;font-size:12px;width:100%;outline:none}
select:focus,input:focus{outline:2px solid color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;padding:6px 0;cursor:pointer}
.results{min-width:0}
.toolbar{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.search-wrap{flex:1;min-width:0}
.search{height:38px;font-size:13px}
.sort{width:auto;min-width:155px;height:38px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600}
.chip button{border:none;background:transparent;color:inherit;font-size:14px;line-height:1;padding:0}
.chip.clear{background:transparent;color:var(--muted);border-color:var(--line)}
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
.model-table{width:100%;border-collapse:collapse;min-width:940px;font-size:12.5px}
.model-table thead th{position:sticky;top:0;background:var(--panel);z-index:2;text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.th-sort{all:unset;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.th-sort:hover{color:var(--ink)}
.th-sort .arrow{color:var(--accent);margin-left:3px}
.model-table tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.model-table tbody tr:last-child td{border-bottom:none}
.model-row{cursor:pointer}
.model-row:hover{background:var(--accent-soft)}
.col-check{width:32px;padding-right:0!important}
.model-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700;font-size:13.5px;line-height:1.3}
.model-sub{font-size:11px;color:var(--muted);margin-top:3px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:310px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.price-cell{font-size:11.5px;line-height:1.5;white-space:nowrap}
.price-cell .lab{color:var(--muted);font-size:10px;margin-right:4px}
.score{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.rating{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.ci{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank{font-size:10px;color:var(--muted);background:var(--accent-soft);border-radius:999px;padding:1px 5px;font-variant-numeric:tabular-nums}
.missing{font-size:11px;color:var(--muted);font-style:italic}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:1px 6px;font-size:9.5px;font-weight:700;line-height:1.6;letter-spacing:.01em;white-space:nowrap}
.badge.stable{color:#047857;background:#ecfdf5;border-color:#a7f3d0}
.badge.beta{color:#b45309;background:#fffbeb;border-color:#fde68a}
.badge.mixed{color:#7c3aed;background:#f5f3ff;border-color:#ddd6fe}
.badge.ow{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
.badge.gateway{color:#475569;background:#f8fafc;border-color:#e2e8f0}
.badge.deprecated{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.reasoning-pill{border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.table-foot{font-size:10.5px;color:var(--muted);padding:9px 2px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:64px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 10px;font-size:11.5px;font-weight:650;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95);color:#fff}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.tiny{padding:3px 6px;font-size:10px}
.mobile-only{display:none}
.mobile-model-list{display:none}
.compare-tray{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);z-index:80;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:7px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 24px);box-shadow:0 14px 40px rgba(0,0,0,.24)}
.compare-tray.hidden{display:none}
.tray-label{font-size:10px;color:#a3a3a3;letter-spacing:.08em;text-transform:uppercase;padding:0 4px;font-family:var(--mono)}
.tray-chip{display:inline-flex;align-items:center;gap:5px;background:#242424;border:1px solid #3a3a3a;border-radius:999px;padding:3px 7px;font-size:10.5px;white-space:nowrap}
.tray-chip button{border:none;background:transparent;color:#a3a3a3;font-size:13px;line-height:1;padding:0}
.tray-chip button:hover{color:#fff}
.tray-btn{border:1px solid #fff;background:#fff;color:#111;border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:750}
.variant-bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:90;background:#111;color:#fff;border:1px solid #333;border-radius:999px;padding:5px;display:flex;align-items:center;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.vb-arrow{background:transparent;border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1}
.vb-arrow:hover{background:#2a2a2a}
.vb-label{display:flex;align-items:baseline;gap:6px;padding:0 8px;font-size:10.5px;color:#d4d4d4;white-space:nowrap}
.vb-label strong{color:#fff;font-family:var(--mono);font-size:12px}
.vb-divider{width:1px;height:16px;background:#333;margin:0 3px}
.vb-scenario{border:1px solid #444;background:#1f1f1f;color:#fff;border-radius:999px;padding:4px 9px;font-size:10.5px}
.vb-scenario:hover{border-color:#888}
.scenario-drawer{position:fixed;right:14px;bottom:62px;z-index:100;width:360px;max-width:calc(100vw - 28px);background:#111;color:#eee;border:1px solid #333;border-radius:14px;padding:15px;box-shadow:0 20px 60px rgba(0,0,0,.35);opacity:0;pointer-events:none;transform:translateY(10px);transition:.15s}
.scenario-drawer.open{opacity:1;pointer-events:auto;transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.drawer-head strong{font-size:13px}
.drawer-head button{border:1px solid #444;background:transparent;color:#aaa;border-radius:999px;padding:3px 8px;font-size:10px}
.scenario-drawer p{font-size:11px;color:#a3a3a3;line-height:1.55;margin-bottom:10px}
.scenario-list{display:grid;gap:6px;margin-bottom:11px}
.scenario-list button{text-align:left;background:#1e1e1e;border:1px solid #333;color:#eee;border-radius:8px;padding:8px 9px;font-size:11px;line-height:1.4}
.scenario-list button:hover{border-color:#777;background:#252525}
.scenario-list span{display:block;color:#8f8f8f;font-size:10px;margin-top:2px}
.drawer-note{border-top:1px solid #2c2c2c;padding-top:9px;font-size:10px;color:#8f8f8f;line-height:1.5}
.toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(8px);z-index:120;background:#111;color:#fff;border-radius:999px;padding:7px 12px;font-size:11px;opacity:0;pointer-events:none;transition:.15s;white-space:nowrap;max-width:calc(100vw - 30px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.site-footer{max-width:1440px;margin:36px auto 0;padding:22px 24px 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:10.5px;line-height:1.6}
.site-footer a{border-bottom:1px dotted var(--line)}

/* Detail */
.detail-wrap{max-width:1440px;margin:0 auto;padding:22px 24px 40px}
.back{border:none;background:transparent;color:var(--muted);font-size:11px;padding:0;margin-bottom:14px}
.back:hover{color:var(--accent)}
.detail-head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.detail-title{flex:1;min-width:260px}
.detail-title h1{font-size:34px;letter-spacing:-.035em;line-height:1.08}
.detail-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:5px}
.detail-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.detail-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.detail-main{display:grid;gap:16px;min-width:0}
.detail-side{position:sticky;top:82px;display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.panel h2{font-size:13px;letter-spacing:-.01em;margin-bottom:10px}
.panel h2 .sub{font-size:10.5px;color:var(--muted);font-weight:400;margin-left:7px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);padding:9px;background:color-mix(in srgb,var(--panel) 92%,var(--bg))}
.fact span{display:block;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.fact strong{font-size:13px;font-variant-numeric:tabular-nums;font-weight:750}
.fact .small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
.offers-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.offer-toggles{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
.mini-check{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.offer-table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:760px}
.offer-table th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.offer-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.offer-table tr:last-child td{border-bottom:none}
.offer-table .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.offer-table tr.is-deprecated{background:#fff7f7}
.offer-table tr.is-gateway{background:#fafafa}
.offer-provider{font-weight:700}
.offer-reason{max-width:190px;color:var(--muted);font-size:10.5px;line-height:1.45}
.mobile-offer-list{display:none}
.mobile-offer{border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);padding:10px;background:color-mix(in srgb,var(--panel) 94%,var(--bg))}
.mobile-offer.is-deprecated{background:#fff7f7}
.mobile-offer-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mobile-offer-top strong{font-size:12px}
.mobile-offer-meta{font-size:10px;color:var(--muted);margin:2px 0 7px}
.mobile-offer-prices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:10.5px}
.mobile-offer-prices span{color:var(--muted)}
.mobile-offer-prices b{display:block;color:var(--ink);font-size:11.5px;font-variant-numeric:tabular-nums}
.mobile-offer-reason{font-size:10px;color:var(--muted);line-height:1.4;margin-top:7px;border-top:1px dotted var(--line);padding-top:6px}
.arena-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.arena-card{border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);padding:13px;background:color-mix(in srgb,var(--panel) 94%,var(--bg));min-height:150px}
.arena-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:7px}
.arena-big{font-size:31px;line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.arena-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
.arena-note{font-size:10px;color:var(--muted);line-height:1.5;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
.arena-missing{color:var(--muted);font-size:12px;padding:18px 0}
.cap-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 14px;font-size:11.5px}
.cap-list div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding-bottom:5px}
.cap-list span{color:var(--muted)}
.cap-list strong{font-weight:650;text-align:right}
.source-box{font-size:10.5px;color:var(--muted);line-height:1.65}
.aa-card{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:calc(var(--radius) - 2px);padding:12px;background:color-mix(in srgb,var(--panel) 94%,var(--bg))}
.aa-card strong{display:block;font-size:12px;margin-bottom:2px}
.aa-card p{font-size:10.5px;color:var(--muted);line-height:1.5}
.side-facts{display:grid;gap:7px}
.side-facts .fact{padding:8px}
.side-actions{display:grid;gap:6px}
.side-actions .btn{width:100%}

/* Variant B detail */
body.variant-B .detail-title h1{font-size:42px;letter-spacing:-.045em}
body.variant-B .detail-layout{grid-template-columns:1fr}
body.variant-B .detail-side{position:static;grid-row:auto}
body.variant-B .panel{border-radius:18px;padding:20px;box-shadow:var(--shadow)}
body.variant-B .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
body.variant-B .fact{border-radius:14px;padding:12px}
body.variant-B .arena-card{border-radius:14px;min-height:170px}

/* Variant C detail */
body.variant-C .detail-title h1{font-family:var(--font-serif);font-size:52px;font-weight:500;letter-spacing:-.03em}
body.variant-C .detail-layout{grid-template-columns:minmax(0,1fr) 300px;gap:26px}
body.variant-C .panel{border-left:2px solid var(--ink);border-right:none;border-top:none;border-bottom:none;border-radius:0;padding:14px 0 14px 16px;box-shadow:none;background:transparent}
body.variant-C .panel h2{font-family:var(--font-serif);font-size:19px;font-weight:500}
body.variant-C .arena-big{font-family:var(--font-serif);font-size:44px;font-weight:500}
body.variant-C .fact{background:transparent;border:none;border-top:1px solid var(--line);border-radius:0;padding:8px 0}
body.variant-C .detail-side{position:sticky;top:82px}

/* Explore B */
.hero-b{max-width:1280px;margin:0 auto;padding:52px 24px 22px}
.hero-b h1{font-size:48px;line-height:1.02;letter-spacing:-.05em;max-width:820px}
.hero-b p{font-size:15px;color:var(--muted);max-width:650px;margin-top:14px}
.hero-b .kicker{font-size:11px}
.filter-bar{max-width:1280px;margin:0 auto 16px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-bar .search{flex:1;min-width:220px;height:36px;border-radius:999px;padding:0 13px}
.filter-bar select{width:auto;min-width:130px;height:36px;border-radius:999px}
.lab-chips{display:flex;gap:5px;flex-wrap:wrap}
.lab-chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 9px;font-size:10.5px}
.lab-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.mini-flags{display:flex;gap:8px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
.model-grid{max-width:1280px;margin:0 auto;padding:0 24px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.model-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:13px;min-width:0}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card-top .lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:4px}

<script>
/* Prototype plan: three radically different visual directions (A workbench, B cards, C editorial) on the same four views, switchable via ?variant=. Real sample data from models.dev + Arena HF; low-fidelity, throwaway. */
const DATA = window.PROTOTYPE_DATA;
const MODELS = DATA.models;
const UNMATCHED = DATA.unmatched;
const LABS = [...new Set(MODELS.map(m => m.lab))].sort((a,b) => a.localeCompare(b,'zh'));
const VARIANTS = {A:'Workbench', B:'Cards', C:'Editorial'};
const VALID_VIEWS = ['explore','detail','compare','leaderboard'];

function readState() {
  const p = new URLSearchParams(location.search);
  return {
    variant: VARIANTS[p.get('variant')] ? p.get('variant') : 'A',
    view: VALID_VIEWS.includes(p.get('view')) ? p.get('view') : 'explore',
    model: p.get('model') || null,
    board: p.get('board') === 'webdev' ? 'webdev' : 'text',
    q: p.get('q') || '',
    labs: (p.get('labs') || '').split(',').filter(Boolean),
    maxOutput: p.get('maxOutput') || '',
    minContext: p.get('minContext') || '',
    reasoning: p.get('reasoning') === '1',
    openWeights: p.get('openWeights') === '1',
    stableOnly: p.get('stableOnly') === '1',
    hasArena: p.get('hasArena') === '1',
    sort: p.get('sort') || 'arena_text',
    showGateways: p.get('showGateways') === '1',
    showDeprecated: p.get('showDeprecated') === '1',
    compare: (p.get('models') || '').split(',').filter(Boolean).slice(0,3),
    lbq: p.get('lbq') || '',
  };
}
let state = readState();

function syncURL(push = false) {
  const p = new URLSearchParams();
  p.set('variant', state.variant);
  if (state.view !== 'explore') p.set('view', state.view);
  if (state.model) p.set('model', state.model);
  if (state.board !== 'text') p.set('board', state.board);
  if (state.q) p.set('q', state.q);
  if (state.labs.length) p.set('labs', state.labs.join(','));
  if (state.maxOutput) p.set('maxOutput', state.maxOutput);
  if (state.minContext) p.set('minContext', state.minContext);
  if (state.reasoning) p.set('reasoning', '1');
  if (state.openWeights) p.set('openWeights', '1');
  if (state.stableOnly) p.set('stableOnly', '1');
  if (state.hasArena) p.set('hasArena', '1');
  if (state.sort !== 'arena_text') p.set('sort', state.sort);
  if (state.showGateways) p.set('showGateways', '1');
  if (state.showDeprecated) p.set('showDeprecated', '1');
  if (state.view === 'compare' && state.compare.length) p.set('models', state.compare.join(','));
  if (state.lbq) p.set('lbq', state.lbq);
  const url = location.pathname + (p.toString() ? '?' + p.toString() : '');
  history[push ? 'pushState' : 'replaceState']({}, '', url);
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(v) { return esc(v); }
function fmtMoney(n) {
  if (n === null || n === undefined) return '未公布';
  if (n === 0) return '免费';
  const r = Math.round(n * 100) / 100;
  return '$' + (Number.isInteger(r) ? r.toFixed(0) : r.toFixed(2).replace(/0$/,''));
}
function fmtRange(a,b) {
  if (a === null || a === undefined || b === null || b === undefined) return '未公布';
  return a === b ? fmtMoney(a) : fmtMoney(a) + '–' + fmtMoney(b);
}
function fmtPrice(m) {
  if (!m.price) return '未公布';
  return fmtRange(m.price.inputMin, m.price.inputMax) + ' / ' + fmtRange(m.price.outputMin, m.price.outputMax);
}
function fmtContext(n) {
  if (!n) return '—';
  if (n >= 1000000) {
    const v = n / 1000000;
    return (Math.round(v * 100) / 100).toString().replace(/\.0+$/,'') + 'M';
  }
  if (n >= 1000) return Math.round(n / 1000) + 'K';
  return String(n);
}
function fmtDate(s) { return s || '—'; }
function statusLabel(s) {
  if (s === 'stable') return '稳定';
  if (s === 'beta') return 'Beta';
  if (s === 'alpha') return 'Alpha';
  if (s.includes('mixed')) return '混合';
  return s;
}
function statusClass(s) {
  if (s === 'stable') return 'stable';
  if (s === 'beta') return 'beta';
  if (s === 'alpha') return 'beta';
  return 'mixed';
}
function statusBadges(m) {
  let html = `<span class="badge ${statusClass(m.status)}">${esc(statusLabel(m.status))}</span>`;
  if (m.openWeights) html += `<span class="badge ow">开源权重</span>`;
  return html;
}
function ratingCell(a) {
  if (!a) return `<span class="missing" title="Arena 未收录，不代表能力差">未收录</span>`;
  const half = (a.ci_high - a.ci_low) / 2;
  return `<span class="score"><span class="rating">${a.rating.toFixed(1)}</span><span class="ci">±${half.toFixed(1)}</span><span class="rank">#${a.rank}</span></span>`;
}
function reasoningPill(m) {
  let short = m.reasoning;
  if (short === '不支持') short = '不支持';
  else if (short.includes('预算')) short = '预算可调';
  else if (short.includes('开关')) short = '开关';
  else if (short.includes('/')) {
    const n = short.split('/').map(x => x.trim()).filter(Boolean).length;
    short = n > 1 ? `可调 ${n} 档` : '可调';
  }
  return `<span class="reasoning-pill" title="${escAttr(m.reasoning)}">${esc(short)}</span>`;
}
function offerKindLabel(k) { return k === 'first_party' ? '第一方' : k === 'cloud' ? '云平台' : '网关'; }
function offerStatusBadge(s) {
  if (s === 'deprecated') return '<span class="badge deprecated">已弃用</span>';
  if (s === 'beta') return '<span class="badge beta">Beta</span>';
  if (s === 'alpha') return '<span class="badge beta">Alpha</span>';
  return '<span class="badge stable">可用</span>';
}
function offerCardMobile(o) {
  return `<div class="mobile-offer ${o.status === 'deprecated' ? 'is-deprecated' : ''}">
    <div class="mobile-offer-top"><strong>${esc(o.provider)}</strong>${offerStatusBadge(o.status)}</div>
    <div class="mobile-offer-meta">${offerKindLabel(o.kind)} · ${esc(o.providerModelId || '')}</div>
    <div class="mobile-offer-prices"><span>Input<b>${fmtMoney(o.input)}</b></span><span>Output<b>${fmtMoney(o.output)}</b></span><span>Context<b>${fmtContext(o.context)}</b></span></div>
    <div class="mobile-offer-reason">${esc(o.reasoning)}</div>
  </div>`;
}
function hasArena(m) { return !!(m.arena.text || m.arena.webdev); }
function modelById(id) { return MODELS.find(m => m.id === id); }
function inCompare(id) { return state.compare.includes(id); }
function labChipHTML(lab) {
  return `<button class="lab-chip ${state.labs.includes(lab) ? 'active' : ''}" onclick="toggleLab(${JSON.stringify(lab)}, ${!state.labs.includes(lab)})">${esc(lab)}</button>`;
}
function sortOptions() {
  const opts = [
    ['arena_text','Arena text（默认）'], ['arena_webdev','Arena webdev'],
    ['newest','最新发布'], ['price','输出价格'], ['context','上下文'],
  ];
  return opts.map(([v,l]) => `<option value="${v}" ${state.sort === v ? 'selected' : ''}>${l}</option>`).join('');
}
function sortArrow(key) {
  return state.sort === key ? '<span class="arrow">↓</span>' : '';
}
function activeChips() {
  const chips = [];
  if (state.q) chips.push(`<span class="chip">搜索“${esc(state.q)}”<button onclick="setSearch('')">×</button></span>`);
  state.labs.forEach(lab => chips.push(`<span class="chip">${esc(lab)}<button onclick="toggleLab(${JSON.stringify(lab)}, false)">×</button></span>`));
  if (state.maxOutput) chips.push(`<span class="chip">输出 ≤ $${esc(state.maxOutput)}<button onclick="setMaxOutput('')">×</button></span>`);
  if (state.minContext) chips.push(`<span class="chip">上下文 ≥ ${fmtContext(Number(state.minContext))}<button onclick="setMinContext('')">×</button></span>`);
  if (state.reasoning) chips.push(`<span class="chip">支持推理<button onclick="toggleFlag('reasoning', false)">×</button></span>`);
  if (state.openWeights) chips.push(`<span class="chip">开源权重<button onclick="toggleFlag('openWeights', false)">×</button></span>`);
  if (state.stableOnly) chips.push(`<span class="chip">仅稳定版<button onclick="toggleFlag('stableOnly', false)">×</button></span>`);
  if (state.hasArena) chips.push(`<span class="chip">只看有评测<button onclick="toggleFlag('hasArena', false)">×</button></span>`);
  if (!chips.length) return '';
  return `<div class="chips">${chips.join('')}<button class="chip clear" onclick="clearFilters()">清除全部</button></div>`;
}

      <option value="">上下文：不限</option>

  </div>`;

function filteredModels() {
  let list = MODELS.filter(m => {
    if (state.q) {
      const q = state.q.toLowerCase();
      const hay = (m.name + ' ' + m.lab + ' ' + m.id + ' ' + m.releaseDate).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (state.labs.length && !state.labs.includes(m.lab)) return false;
    if (state.maxOutput) {
      const max = Number(state.maxOutput);
      if (!m.price || m.price.outputMin > max) return false;
    }
    if (state.minContext) {
      const min = Number(state.minContext);
      if (!m.context || m.context < min) return false;
    }
    if (state.reasoning && m.reasoning === '不支持') return false;
    if (state.openWeights && !m.openWeights) return false;
    if (state.stableOnly && m.status !== 'stable') return false;
    if (state.hasArena && !hasArena(m)) return false;
    return true;
  });
  list.sort((a,b) => {
    if (state.sort === 'newest') return (b.releaseDate || '').localeCompare(a.releaseDate || '') || a.name.localeCompare(b.name);
    if (state.sort === 'price') {
      const av = a.price?.outputMin ?? Infinity, bv = b.price?.outputMin ?? Infinity;
      return av - bv || a.name.localeCompare(b.name);
    }
    if (state.sort === 'context') return (b.context || 0) - (a.context || 0) || a.name.localeCompare(b.name);
    const board = state.sort === 'arena_webdev' ? 'webdev' : 'text';
    const ar = a.arena[board], br = b.arena[board];
    if (ar && br) return br.rating - ar.rating || ar.rank - br.rank || a.name.localeCompare(b.name);
    if (ar) return -1;
    if (br) return 1;
    return a.name.localeCompare(b.name);
  });
  return list;
}

    ${visibleOffers.length ? `<div class="offer-table-wrap desktop-only" style="overflow:auto"><table class="offer-table"><thead><tr><th>Provider</th><th>类型</th><th>状态</th><th>Input</th><th>Output</th><th>Cache</th><th>Context</th><th>Reasoning</th></tr></thead><tbody>${offersRows}</tbody></table></div><div class="mobile-offer-list">${visibleOffers.map(offerCardMobile).join('')}</div>` : `<div class="empty" style="padding:24px">当前筛选下没有可见报价。打开上面的开关查看网关 / 已弃用报价。</div>`}
    <p class="source-box" style="margin-top:9px">价格单位 USD / 1M tokens；“未公布”不是 $0；“免费”才表示 0。默认只展示第一方 + 主要云平台。</p>
  </section>`;
  const arenaCard = (board, label) => {
    const a = m.arena[board];
    if (!a) return `<div class="arena-card"><div class="arena-label">${label}<span class="badge">未收录</span></div><div class="arena-missing">Arena 未收录。这不代表能力差。</div><a class="btn tiny" href="?view=leaderboard&board=${board}" onclick="event.preventDefault();goLeaderboard('${board}')">查看 Arena ${board} 榜</a></div>`;
    return `<div class="arena-card"><div class="arena-label">${label}<span class="badge">${esc(a.condition)}</span></div><div class="arena-big">${a.rating.toFixed(1)}</div><div class="arena-meta"><span>CI ${a.ci_low.toFixed(1)}–${a.ci_high.toFixed(1)}</span><span>#${a.rank}</span><span>${a.votes.toLocaleString('en-US')} votes</span></div><div class="arena-note">${esc(a.model_name)} · ${esc(a.date)} · Arena HF</div></div>`;
  };
  const arena = `<section class="panel"><h2>Arena 评测 <span class="sub">分榜展示 · 不跨榜比较</span></h2><div class="arena-grid">${arenaCard('text','Arena text')}${arenaCard('webdev','Arena webdev')}</div><p class="source-box" style="margin-top:9px">Arena rating 是偏好评分，不是准确率；置信区间重叠时不宣称显著优劣。text / webdev 是两个独立 Board。</p></section>`;
  const modalities = m.modalities ? `${(m.modalities.input || []).join(' / ')} → ${(m.modalities.output || []).join(' / ')}` : '未提供';
  const cap = `<section class="panel"><h2>能力与模态</h2><div class="cap-list">
    <div><span>输入 / 输出模态</span><strong>${esc(modalities)}</strong></div>
    <div><span>工具调用</span><strong>${m.toolCall ? '支持' : '未提供'}</strong></div>
    <div><span>结构化输出</span><strong>${m.structuredOutput ? '支持' : '未提供'}</strong></div>
    <div><span>知识截止</span><strong>${esc(m.knowledge || '未提供')}</strong></div>
    <div><span>开源权重</span><strong>${m.openWeights ? '是' : '否'}</strong></div>
    <div><span>推理等级</span><strong>${esc(m.reasoning)}</strong></div>
  </div></section>`;
  const aa = `<section class="panel"><div class="aa-card"><div><strong>外部评测 · Artificial Analysis</strong><p>站内不展示 AA 分数，也不调用 AA API。需要 Intelligence / Coding / 速度等指标时，请到 AA 查看。</p></div><a class="btn ghost" style="border-color:var(--line)" href="${escAttr(m.aaUrl)}" target="_blank" rel="noopener">打开 AA</a></div></section>`;
  const sources = `<section class="panel"><h2>来源与更新时间</h2><div class="source-box">models.dev（MIT）· Arena HuggingFace（CC BY 4.0）· 快照 2026-10-26<br>价格以供应商官网为准；Arena 分数为 latest 样例，正式数据会记录 snapshot 日期。<br>原型只展示 12 个样例模型，不代表完整目录。</div></section>`;
  const header = `<div class="detail-head">
    <div class="detail-title"><button class="back" onclick="backToExplore()">← 返回模型表</button><h1>${esc(m.name)}</h1><div class="detail-sub">${esc(m.lab)} · ${esc(m.id)}</div><div class="detail-badges">${statusBadges(m)}</div></div>
    <div class="detail-actions"><button class="btn ${inCompare(m.id) ? 'primary' : ''}" onclick="toggleCompareFromDetail('${escAttr(m.id)}')">${inCompare(m.id) ? '已加入对比' : '加入对比'}</button><a class="btn ghost" href="${escAttr(m.aaUrl)}" target="_blank" rel="noopener">AA 外链</a></div>
  </div>`;
  if (state.variant === 'A') {
    return `<div class="detail-wrap">${header}<div class="detail-layout"><div class="detail-main">${offers}${arena}${cap}${aa}${sources}</div><aside class="detail-side"><div class="panel"><h2>关键事实</h2>${facts}</div><div class="panel side-actions"><button class="btn ${inCompare(m.id) ? 'primary' : ''}" onclick="toggleCompareFromDetail('${escAttr(m.id)}')">${inCompare(m.id) ? '已加入对比' : '加入对比'}</button><button class="btn" onclick="backToExplore()">返回模型表</button></div></aside></div></div>`;
  }
  if (state.variant === 'B') {
    return `<div class="detail-wrap">${header}<div class="detail-stack" style="display:grid;gap:14px;max-width:1050px">${facts}${offers}${arena}${cap}${aa}${sources}</div></div>`;
  }
  return `<div class="detail-wrap">${header}<div class="detail-layout"><div class="detail-main">${offers}${arena}${cap}${aa}${sources}</div><aside class="detail-side"><div class="panel"><h2>关键事实</h2>${facts}</div></aside></div></div>`;
}

function compareFields(m) {
  return [
    ['实验室', esc(m.lab)],
    ['状态', statusBadges(m)],
    ['输入价格', fmtRange(m.price?.inputMin, m.price?.inputMax) + ' / 1M'],
    ['输出价格', fmtRange(m.price?.outputMin, m.price?.outputMax) + ' / 1M'],
    ['上下文', fmtContext(m.context)],
    ['推理', esc(m.reasoning)],
    ['Arena text', m.arena.text ? m.arena.text.rating.toFixed(1) + ' · #' + m.arena.text.rank + ' · ' + m.arena.text.condition : '未收录'],
    ['Arena webdev', m.arena.webdev ? m.arena.webdev.rating.toFixed(1) + ' · #' + m.arena.webdev.rank + ' · ' + m.arena.webdev.condition : '未收录'],
    ['开源权重', m.openWeights ? '是' : '否'],
    ['发布', esc(m.releaseDate)],
    ['AA', '<a href="' + escAttr(m.aaUrl) + '" target="_blank" rel="noopener">外部链接</a>'],
  ];
}
function compareEmpty() {
  return `<div class="compare-empty"><div class="kicker">COMPARE</div><h1>先选两个模型</h1><p>从模型表勾选，或在详情页点「加入对比」。最多 3 个。</p><button class="btn primary" onclick="backToExplore()">去模型表</button></div>`;
}
function renderCompare() {
  const models = state.compare.map(modelById).filter(Boolean);
  if (!models.length) return compareEmpty();
  const fieldsPerModel = models.map(compareFields);
  const labels = fieldsPerModel[0].map(f => f[0]);
  const fieldValues = labels.map((label, i) => models.map((m, j) => fieldsPerModel[j][i][1]));
  const diff = fieldValues.map(vals => new Set(vals.map(v => v.replace(/<[^>]+>/g,''))).size > 1);
  const head = `<div class="compare-head"><div><div class="kicker">COMPARE SET · ${models.length}/3</div><h1>并排比较</h1><p>差异高亮只表示不同，不判定赢家；缺失用「—」表示。</p></div><div class="detail-actions"><button class="btn ghost" onclick="backToExplore()">← 返回模型表</button></div></div>`;
  if (state.variant === 'A') {
    return `<div class="compare-wrap">${head}<div class="compare-table-wrap"><table class="compare-table"><thead><tr><th>字段</th>${models.map(m => `<th>${esc(m.name)}<div class="cell-sub">${esc(m.lab)} <button class="btn tiny" onclick="toggleCompare('${escAttr(m.id)}',false)">移除</button></div></th>`).join('')}</tr></thead><tbody>${labels.map((label,i) => `<tr><td>${esc(label)}</td>${fieldValues[i].map((v,j) => `<td class="${diff[i] ? 'diff' : ''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="source-box" style="margin-top:10px">价格 USD / 1M tokens；完整报价见模型详情。Arena text / webdev 不可跨榜比较。</p></div>`;
  }
  if (state.variant === 'B') {
    return `<div class="compare-wrap">${head}<div class="compare-cards">${models.map((m,j) => `<article class="compare-card"><h3>${esc(m.name)}</h3><div class="lab">${esc(m.lab)}</div><div class="compare-fields">${labels.map((label,i) => `<div class="compare-field ${diff[i] ? 'diff' : ''}"><span>${esc(label)}</span><strong>${fieldValues[i][j]}</strong></div>`).join('')}</div><div class="card-actions" style="margin-top:10px"><button class="btn" onclick="openModel('${escAttr(m.id)}')">详情</button><button class="btn ghost" onclick="toggleCompare('${escAttr(m.id)}',false)">移除</button></div></article>`).join('')}</div><p class="source-box" style="margin-top:10px">最多 3 个；缺失显示「—」；差异高亮只表示不同。</p></div>`;
  }
  return `<div class="compare-wrap">${head}<div class="versus-grid">${models.map((m,j) => `<div class="versus-col"><h3>${esc(m.name)}</h3><div class="lab">${esc(m.lab)}</div><div class="versus-score"><span>Arena text</span>${m.arena.text ? m.arena.text.rating.toFixed(1) : '未收录'}</div><div class="versus-fields">${labels.map((label,i) => `<div class="versus-field ${diff[i] ? 'diff' : ''}"><span>${esc(label)}</span><strong>${fieldValues[i][j]}</strong></div>`).join('')}</div><div class="card-actions" style="margin-top:10px"><button class="btn" onclick="openModel('${escAttr(m.id)}')">详情</button><button class="btn ghost" onclick="toggleCompare('${escAttr(m.id)}',false)">移除</button></div></div>`).join('')}</div><p class="source-box" style="margin-top:10px">缺失用「—」；差异高亮不判定赢家。</p></div>`;
}

function lbRows() {
  const rows = MODELS.filter(m => m.arena[state.board]).map(m => ({kind:'model', m, a:m.arena[state.board]}));
  UNMATCHED.filter(u => u.board === state.board).forEach(u => rows.push({kind:'unmatched', a:u}));
  const q = state.lbq.toLowerCase();
  return rows.filter(r => {
    if (!q) return true;
    const hay = (r.a.model_name + ' ' + r.a.organization + ' ' + (r.m?.name || '')).toLowerCase();
    return hay.includes(q);
  }).sort((a,b) => a.a.rank - b.a.rank);
}
function renderLeaderboard() {
  const rows = lbRows();
  const boardName = state.board === 'text' ? 'Arena text' : 'Arena webdev';
  const head = `<div class="lb-head"><div><div class="kicker">LEADERBOARD · ${boardName}</div><h1>Arena 榜单</h1><p>rating 是偏好评分，不是准确率；text / webdev 不可直接比较；未匹配行保留在榜单，不链模型页。</p></div><div class="detail-actions"><button class="btn" onclick="goExplore()">← 模型表</button></div></div>
  <div class="board-tabs"><button class="board-tab ${state.board === 'text' ? 'active' : ''}" onclick="setBoard('text')">Arena text</button><button class="board-tab ${state.board === 'webdev' ? 'active' : ''}" onclick="setBoard('webdev')">Arena webdev</button></div>
  <div class="lb-toolbar"><input class="search" id="lb-search" placeholder="搜索模型 / 组织" value="${escAttr(state.lbq)}" oninput="setLbSearch(this.value)"></div>
  <div class="lb-source">来源：Arena HuggingFace leaderboard-dataset · CC BY 4.0 · 快照 2026-10-22/23 · 原型只加载样例行；正式榜单单页 50 条 + 显示更多。</div>`;
  if (!rows.length) return `<div class="lb-wrap">${head}${emptyResults()}</div>`;
  if (state.variant === 'A') {
    return `<div class="lb-wrap">${head}<div class="lb-table-wrap"><table class="lb-table"><thead><tr><th>Rank</th><th>Model</th><th>Organization</th><th>Rating</th><th>Condition</th><th>Votes</th></tr></thead><tbody>${rows.map(r => `<tr class="${r.kind === 'model' ? 'lb-row' : ''}" ${r.kind === 'model' ? `onclick="openModel('${escAttr(r.m.id)}')"` : ''}><td class="lb-rank">#${r.a.rank}</td><td><span class="lb-name">${esc(r.m?.name || r.a.model_name)}</span>${r.kind === 'unmatched' ? ' <span class="lb-badge">未匹配</span>' : ''}<div class="lb-org">${esc(r.a.organization)}</div></td><td>${esc(r.a.organization)}</td><td><span class="lb-rating">${r.a.rating.toFixed(1)}</span> <span class="lb-ci">±${((r.a.ci_high-r.a.ci_low)/2).toFixed(1)}</span></td><td>${esc(r.a.condition)}</td><td class="num">${r.a.votes.toLocaleString('en-US')}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  if (state.variant === 'B') {
    return `<div class="lb-wrap">${head}<div class="lb-cards">${rows.map(r => `<div class="lb-card ${r.kind === 'unmatched' ? 'unmatched' : ''}" ${r.kind === 'model' ? `onclick="openModel('${escAttr(r.m.id)}')" style="cursor:pointer"` : ''}><div class="rank">#${r.a.rank}</div><div><h3>${esc(r.m?.name || r.a.model_name)} ${r.kind === 'unmatched' ? '<span class="lb-badge">未匹配</span>' : ''}</h3><div class="org">${esc(r.a.organization)} · ${esc(r.a.condition)}</div></div><div class="score">${r.a.rating.toFixed(1)}<span>±${((r.a.ci_high-r.a.ci_low)/2).toFixed(1)} · ${r.a.votes.toLocaleString('en-US')} votes</span></div></div>`).join('')}</div></div>`;
  }
  return `<div class="lb-wrap">${head}<div class="lb-editorial">${rows.map(r => `<div class="lb-row ${r.kind === 'unmatched' ? 'unmatched' : ''}" ${r.kind === 'model' ? `onclick="openModel('${escAttr(r.m.id)}')"` : ''}><div class="rank">${String(r.a.rank).padStart(2,'0')}</div><div><div class="name">${esc(r.m?.name || r.a.model_name)} ${r.kind === 'unmatched' ? '<span class="lb-badge">未匹配</span>' : ''}</div><div class="org">${esc(r.a.organization)} · ${esc(r.a.condition)}</div></div><div class="rating">${r.a.rating.toFixed(1)}</div><div class="votes">±${((r.a.ci_high-r.a.ci_low)/2).toFixed(1)}<br>${r.a.votes.toLocaleString('en-US')} votes</div></div>`).join('')}</div></div>`;
}

function render() {
  document.body.classList.remove('variant-A','variant-B','variant-C','view-explore','view-detail','view-compare','view-leaderboard');
  document.body.classList.add('variant-' + state.variant, 'view-' + state.view);
  const app = document.getElementById('app');
  if (state.view === 'detail') app.innerHTML = renderDetail();
  else if (state.view === 'compare') app.innerHTML = renderCompare();
  else if (state.view === 'leaderboard') app.innerHTML = renderLeaderboard();
  else app.innerHTML = state.variant === 'B' ? renderExploreB() : state.variant === 'C' ? renderExploreC() : renderExploreA();
  document.getElementById('nav-explore').classList.toggle('active', state.view !== 'leaderboard');
  document.getElementById('nav-leaderboard').classList.toggle('active', state.view === 'leaderboard');
  document.getElementById('variant-key').textContent = state.variant;
  document.getElementById('variant-name').textContent = VARIANTS[state.variant];
  renderTray();
  syncURL(false);
}
function refresh(preserve = true) {
  const el = document.activeElement;
  const id = el && el.id;
  const start = el && typeof el.selectionStart === 'number' ? el.selectionStart : null;
  render();
  if (preserve && id) {
    const next = document.getElementById(id);
    if (next) {
      next.focus();
      if (start !== null && next.setSelectionRange) {
        try { next.setSelectionRange(start, start); } catch (e) {}
      }
    }
  }
}
function renderTray() {
  const tray = document.getElementById('compare-tray');
  if (!state.compare.length || state.view === 'compare') {
    tray.classList.add('hidden');
    tray.innerHTML = '';
    return;
  }
  tray.classList.remove('hidden');
  tray.innerHTML = `<span class="tray-label">对比 ${state.compare.length}/3</span>` +
    state.compare.map(id => {
      const m = modelById(id);
      return `<span class="tray-chip">${esc(m ? m.name : id)}<button onclick="toggleCompare('${escAttr(id)}',false)" aria-label="移除">×</button></span>`;
    }).join('') +
    `<button class="tray-btn" onclick="openCompare()">去对比</button>`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 1900);
}
function goExplore() {
  state.view = 'explore'; state.model = null; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function goLeaderboard(board) {
  state.view = 'leaderboard'; state.model = null;
  if (board === 'webdev' || board === 'text') state.board = board;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function openModel(id) {
  state.view = 'detail'; state.model = id; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function backToExplore() {
  state.view = 'explore'; state.model = null; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function setBoard(board) {
  state.board = board; state.lbq = ''; render();
}
function setLbSearch(v) {
  state.lbq = v; refresh(true);
}
function toggleCompare(id, force) {
  const exists = state.compare.includes(id);
  const shouldAdd = force === undefined ? !exists : !!force;
  if (shouldAdd && !exists) {
    if (state.compare.length >= 3) { showToast('最多选择 3 个模型'); refresh(false); return; }
    state.compare.push(id);
  } else if (!shouldAdd && exists) {
    state.compare = state.compare.filter(x => x !== id);
  }
  render();
}
function toggleCompareFromDetail(id) {
  toggleCompare(id);
}
function openCompare() {
  if (state.compare.length < 2) { showToast('再选一个模型就能对比'); return; }
  state.view = 'compare'; state.model = null; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function setSearch(v) { state.q = v; refresh(true); }
function toggleLab(lab, checked) {
  if (checked && !state.labs.includes(lab)) state.labs.push(lab);
  if (!checked) state.labs = state.labs.filter(x => x !== lab);
  refresh(false);
}
function setMaxOutput(v) { state.maxOutput = v; refresh(false); }
function setMinContext(v) { state.minContext = v; refresh(false); }
function toggleFlag(key, v) { state[key] = v; refresh(false); }
function setSort(v) { state.sort = v; refresh(false); }
function clearFilters() {
  state.q = ''; state.labs = []; state.maxOutput = ''; state.minContext = '';
  state.reasoning = false; state.openWeights = false; state.stableOnly = false; state.hasArena = false;
  state.sort = 'arena_text'; render();
}
function toggleFilters() {
  const el = document.getElementById('filters-panel');
  if (el) el.classList.toggle('open');
}
function toggleOfferFlag(key, v) { state[key] = v; render(); }
function setVariant(v) {
  if (!VARIANTS[v]) return;
  state.variant = v; render();
}
function cycleVariant(delta) {
  const keys = Object.keys(VARIANTS);
  const i = keys.indexOf(state.variant);
  setVariant(keys[(i + delta + keys.length) % keys.length]);
}
function toggleScenarios(force) {
  const el = document.getElementById('scenario-drawer');
  const open = force === undefined ? !el.classList.contains('open') : !!force;
  el.classList.toggle('open', open);
  el.setAttribute('aria-hidden', String(!open));
}
function runScenario(n) {
  toggleScenarios(false);
  state.q = ''; state.labs = []; state.maxOutput = ''; state.minContext = '';
  state.reasoning = false; state.openWeights = false; state.stableOnly = false; state.hasArena = false;
  state.sort = 'arena_text'; state.showGateways = false; state.showDeprecated = false;
  state.lbq = ''; state.compare = []; state.board = 'text'; state.model = null;
  if (n === 1) {
    state.view = 'explore'; state.maxOutput = '5'; state.minContext = '128000';
  } else if (n === 2) {
    state.compare = ['anthropic/claude-opus-5-5','openai/gpt-6-astra','alibaba/qwen3.8-max'];
    state.view = 'compare';
  } else if (n === 3) {
    state.view = 'detail'; state.model = 'anthropic/claude-haiku-5-5';
  } else if (n === 4) {
    state.view = 'leaderboard'; state.board = 'text';
  } else if (n === 5) {
    state.view = 'detail'; state.model = 'moonshotai/kimi-k3';
    state.showGateways = true; state.showDeprecated = true;
  }
  render(); window.scrollTo({top:0,behavior:'smooth'});
  showToast(`场景 ${n} 已加载`);
}
function resetPrototype() {
  state = {
    variant: state.variant, view: 'explore', model: null, board: 'text', q: '', labs: [],
    maxOutput: '', minContext: '', reasoning: false, openWeights: false, stableOnly: false,
    hasArena: false, sort: 'arena_text', showGateways: false, showDeprecated: false, compare: [], lbq: '',
  };
  toggleScenarios(false); render(); window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('popstate', () => { state = readState(); render(); });
window.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); cycleVariant(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); cycleVariant(1); }
});
render();
</script>
</body>
</html>
