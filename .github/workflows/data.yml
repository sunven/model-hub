name: Refresh data

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://model-hub.example
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run data:refresh
      - run: pnpm run schema:check
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run build
      - name: Commit validated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest data/schema data/fx.yml
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(data): refresh validated snapshot"
          git push
      - name: Upload failed snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-validation-report
          path: data/validation-report.json
          if-no-files-found: ignore
